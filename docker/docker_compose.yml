services:
  # MASTER NODE
  redis-local:
    image: redis:7
    container_name: bordergate-redis-local
    restart: unless-stopped
    ports:
      - "${REDIS_LOCAL_PORT:-6379}:6379"
    volumes:
      - redis_local_data:/data
    command: redis-server --appendonly yes
    networks:
      - redisnet

  # FIRST REPLICA 
  redis-replica-1:
    image: redis:7
    container_name: bordergate-redis-replica-1
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --replicaof redis-local 6379 --appendonly yes
    depends_on:
      - redis-local
    networks:
      - redisnet

  # SECOND REPLICA
  redis-replica-2:
    image: redis:7
    container_name: bordergate-redis-replica-2
    restart: unless-stopped
    ports:
      - "6381:6379"
    command: redis-server --replicaof redis-local 6379 --appendonly yes
    depends_on:
      - redis-local
    networks:
      - redisnet

  # SENTINEL 1
  sentinel-1:
    image: redis:7
    container_name: bordergate-sentinel-1
    command: >
      sh -c "cp /etc/redis/sentinel1.conf /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    volumes:
      - ./sentinel1.conf:/etc/redis/sentinel1.conf:ro
    depends_on:
      - redis-local
      - redis-replica-1
      - redis-replica-2
    networks:
      - redisnet

  # SENTINEL 2
  sentinel-2:
    image: redis:7
    container_name: bordergate-sentinel-2
    command: >
      sh -c "cp /etc/redis/sentinel2.conf /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    volumes:
      - ./sentinel2.conf:/etc/redis/sentinel2.conf:ro
    depends_on:
      - redis-local
      - redis-replica-1
      - redis-replica-2
    networks:
      - redisnet

  # SENTINEL 3
  sentinel-3:
    image: redis:7
    container_name: bordergate-sentinel-3
    command: >
      sh -c "cp /etc/redis/sentinel3.conf /tmp/sentinel.conf &&
             redis-sentinel /tmp/sentinel.conf"
    volumes:
      - ./sentinel3.conf:/etc/redis/sentinel3.conf:ro
    depends_on:
      - redis-local
      - redis-replica-1
      - redis-replica-2
    networks:
      - redisnet

  # APACHE CASSANDRA 
  cassandra:
    image: cassandra:5.0
    container_name: bordergate-cassandra
    hostname: bordergate-cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    volumes:
      - bordergate-cassandra-data:/var/lib/cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: BorderGate
      CASSANDRA_DC: Mad_Barajas
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 16
      MAX_HEAP_SIZE: 512M
      MAX_DIRECT_MEMORY_SIZE: 256M
    networks:
      - bordergate-net

networks:
  redisnet:
    driver: bridge
  bordergate-net:
    driver: bridge

volumes:
  redis_local_data:
  bordergate-cassandra-data:
    name: bordergate-cassandra-data